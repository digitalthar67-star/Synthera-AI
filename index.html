<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synthear AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#fff;--side:#f9f9f9;--text:#0d0d0d;--muted:#6b6b6b;--border:#e5e5e5;--soft:#f4f4f4;--hover:#ececec;--btn:#0d0d0d;--btntext:#fff;--shadow:0 4px 24px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#212121;--side:#171717;--text:#ececec;--muted:#a0a0a0;--border:#3a3a3a;--soft:#2f2f2f;--hover:#2a2a2a;--btn:#ececec;--btntext:#111;--shadow:0 4px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.ib:hover{background:var(--hover)}

/* sidebar */
#side{width:260px;background:var(--side);display:flex;flex-direction:column;padding:8px;transition:margin .25s;flex:none;z-index:30}
#side.hide{margin-left:-260px}
.sbtop{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;padding-left:6px}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;width:100%;text-align:left;font-size:14.5px}
.row:hover,.row.active{background:var(--hover)}
#list{flex:1;overflow-y:auto;margin:8px 0}
.lbl{font-size:12px;color:var(--muted);padding:10px 10px 4px}
.chat{justify-content:space-between;cursor:pointer}
.chat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chat .del{opacity:0;color:var(--muted)}
.chat:hover .del{opacity:1}
.credit{font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--border);margin-top:4px}

/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{display:flex;align-items:center;gap:6px;padding:8px 12px}
#modelBtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:17px;font-weight:600}
#modelBtn:hover{background:var(--hover)}
#modelBtn small{color:var(--muted);font-weight:400}
.grow{flex:1}
#scroll{flex:1;overflow-y:auto}
#wrap{max-width:760px;margin:0 auto;padding:12px 18px 30px;display:flex;flex-direction:column;gap:26px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bub{background:var(--soft);padding:10px 18px;border-radius:22px;max-width:80%;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.msg.assistant .body{line-height:1.75;font-size:16px;word-wrap:break-word}
.body>*:first-child{margin-top:0}
.body p{margin:.7em 0}.body ul,.body ol{margin:.6em 0 .6em 1.5em}.body li{margin:.25em 0}
.body h1,.body h2,.body h3{margin:1.1em 0 .4em;line-height:1.3}
.body table{border-collapse:collapse;margin:.8em 0;display:block;overflow-x:auto}.body th,.body td{border:1px solid var(--border);padding:7px 12px}
.body a{color:#2f7cf6}
.body blockquote{border-left:3px solid var(--border);padding-left:14px;color:var(--muted)}
.body :not(pre)>code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:.88em}
.codebox{margin:.9em 0;border-radius:14px;overflow:hidden;background:#0d0d0d;border:1px solid var(--border)}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;background:#2f2f2f;color:#cfcfcf;font-size:12.5px}
.codehead button{color:#cfcfcf;display:flex;gap:6px;align-items:center;font-size:12.5px}
.codebox pre{margin:0}.codebox code{display:block;padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;background:transparent!important}
.acts{display:flex;gap:2px;margin-top:6px;color:var(--muted)}
.acts button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.acts button:hover{background:var(--hover);color:var(--text)}
.typing::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--text);margin-left:4px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.5}}
.err{color:#d93b3b}

/* hero */
.hero{margin:12vh auto 0;text-align:center}
.hero h1{font-size:30px;font-weight:600;margin-bottom:22px}
.sugs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:640px;margin:0 auto}
.sug{border:1px solid var(--border);border-radius:99px;padding:9px 16px;font-size:14px;color:var(--muted)}
.sug:hover{background:var(--hover);color:var(--text)}

/* composer */
#comp{padding:0 16px 10px}
.cbox{max-width:760px;margin:0 auto;background:var(--soft);border-radius:28px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px}
.pill{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 6px 4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--border)}
.pill button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pill button:hover{background:var(--hover)}
.crow{display:flex;align-items:flex-end;gap:4px}
textarea{flex:1;background:none;border:none;outline:none;resize:none;padding:8px 6px;line-height:1.5;max-height:200px;font-size:16px}
#send{width:36px;height:36px;border-radius:50%;background:var(--btn);color:var(--btntext);display:grid;place-items:center;flex:none}
#send:disabled{opacity:.25;cursor:default}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:8px 0 0}

/* popovers */
.pop{position:fixed;background:var(--bg);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:6px;z-index:50;display:none;max-height:70vh;overflow-y:auto}
.pop.show{display:block}
.pop .row{border-radius:10px}
.pop .sep{height:1px;background:var(--border);margin:5px 4px}
.pop .grp{font-size:12px;color:var(--muted);padding:8px 10px 3px}
.chk{margin-left:auto}
.tg{margin-left:auto;width:34px;height:20px;border-radius:99px;background:var(--border);position:relative;transition:.2s;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:#10a37f}.tg.on::after{left:16px}

/* settings */
dialog{margin:auto;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:20px;width:min(640px,94vw);max-height:90vh;padding:0;overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:17px}
.db{padding:6px 20px 20px;overflow-y:auto;max-height:calc(90vh - 62px)}
.sec{margin-top:18px}
.sec h4{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mcard{border:1px solid var(--border);border-radius:12px;padding:11px 13px;text-align:left;display:flex;gap:10px;align-items:center;font-size:14.5px}
.mcard:hover{background:var(--hover)}
.mcard.sel{border-color:var(--text);background:var(--soft)}
.mcard small{display:block;color:var(--muted);font-size:11.5px;word-break:break-all}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:14.5px}
select{background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
input[type=range]{width:180px}
.dng{border:1px solid #d93b3b55;color:#d93b3b;border-radius:10px;padding:8px 14px;font-size:14px}

@media(max-width:800px){
#side{position:fixed;inset:0 auto 0 0;margin-left:-270px;width:260px;box-shadow:var(--shadow)}
#side.open{margin-left:0}
#side.hide{margin-left:-270px}
.hero h1{font-size:24px}
#modelBtn small{display:none}
}
</style>
</head>
<body>

<aside id="side">
  <div class="sbtop">
    <div class="brand"><i>S</i> Synthear AI</div>
    <button class="ib" id="closeSide" title="Close sidebar"></button>
  </div>
  <button class="row" id="newChat"></button>
  <div id="list"></div>
  <button class="row" id="openSet"></button>
  <div class="credit">Made by Mr. Dost Kumar</div>
</aside>

<div id="main">
  <div id="top">
    <button class="ib" id="openSide" title="Sidebar"></button>
    <button id="modelBtn"><span id="modelName">Synthear AI</span><span id="caret"></span></button>
    <div class="grow"></div>
    <button class="ib" id="themeBtn" title="Theme"></button>
  </div>

  <div id="scroll"><div id="wrap"></div></div>

  <div id="comp">
    <div class="cbox">
      <div class="pills" id="pills"></div>
      <div class="crow">
        <button class="ib" id="plusBtn" title="More"></button>
        <textarea id="input" rows="1" placeholder="Message Synthear AI"></textarea>
        <button class="ib" id="micBtn" title="Voice input"></button>
        <button id="send" title="Send"></button>
      </div>
    </div>
    <div class="foot">Synthear AI can make mistakes. Check important info.</div>
    <input type="file" id="file" hidden accept=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.c,.cpp,.cs,.go,.rs,.php,.sql,.xml,.yml,.yaml,.log">
  </div>
</div>

<div class="pop" id="modelPop"></div>
<div class="pop" id="plusPop"></div>

<dialog id="dlg">
  <div class="dh"><span>Settings</span><button class="ib" id="closeSet"></button></div>
  <div class="db">
    <div class="sec"><h4 id="mcount">Models</h4><div class="mgrid" id="mgrid"></div></div>
    <div class="sec">
      <h4>Preferences</h4>
      <div class="field"><span>Theme</span><select id="themeSel"><option value="light">Light</option><option value="dark">Dark</option></select></div>
      <div class="field"><span>Creativity</span><input type="range" id="temp" min="0" max="1.2" step="0.1"></div>
      <div class="field"><span>Voice input language</span>
        <select id="langSel"><option value="en-US">English</option><option value="ur-PK">Urdu</option><option value="hi-IN">Hindi</option><option value="sd-PK">Sindhi (if supported)</option></select></div>
    </div>
    <div class="sec"><h4>Data</h4><button class="dng" id="clearAll">Delete all chats</button></div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const svg = (p, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  plus: '<path d="M12 5v14M5 12h14"/>', up: '<path d="M12 19V5M5 12l7-7 7 7"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  side: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>', edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  speak: '<path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>', redo: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  check: '<path d="M5 12l5 5L20 7"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', down: '<path d="M6 9l6 6 6-6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', code: '<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',
  clip: '<path d="M21 11.5 12.5 20a5.5 5.5 0 0 1-8-8L13 3.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6L15 6.5"/>',
  tool: '<path d="M14.7 6.3a4 4 0 0 0 5 5L11 20a2.1 2.1 0 0 1-3-3Z"/><path d="M14.7 6.3 18 3l3 3-3.3 3.3"/>'
};
const TOOLS = { translate: "Translate", summarize: "Summarize", rewrite: "Improve writing", explain: "Explain simply", math: "Math solver", email: "Email writer", debug: "Debug code", quiz: "Quiz maker" };
const SUGS = ["Explain how the internet works", "Write a Python script to rename files", "Give me a 7-day study plan", "Translate to Urdu: Good morning, my friend"];

const S = { models: [], model: store("sx_model"), chats: store("sx_chats") || [], cur: null, mode: "chat", tool: null, search: false, attach: null,
  busy: false, abort: null, lang: store("sx_lang") || "en-US", temp: store("sx_temp") ?? 0.7 };
const save = () => store("sx_chats", S.chats.slice(0, 80));
const curChat = () => S.chats.find(c => c.id === S.cur);
const modelName = id => (S.models.find(m => m.id === id) || {}).name || "Synthear AI";

/* ---------- icons ---------- */
function paintIcons() {
  $("#closeSide").innerHTML = svg(IC.side); $("#openSide").innerHTML = svg(IC.side);
  $("#newChat").innerHTML = svg(IC.edit, 18) + "New chat"; $("#openSet").innerHTML = svg(IC.gear, 18) + "Settings";
  $("#caret").innerHTML = svg(IC.down, 16); $("#plusBtn").innerHTML = svg(IC.plus, 22); $("#micBtn").innerHTML = svg(IC.mic, 20);
  $("#closeSet").innerHTML = svg(IC.x); paintTheme(); paintSend();
}
function paintTheme() { $("#themeBtn").innerHTML = svg(document.documentElement.dataset.theme === "dark" ? IC.sun : IC.moon, 19); }
function paintSend() { $("#send").innerHTML = S.busy ? svg(IC.stop, 18) : svg(IC.up, 19); $("#send").disabled = !S.busy && !$("#input").value.trim() && !S.attach; }

/* ---------- markdown ---------- */
function md(t) {
  if (!window.marked || !window.DOMPurify) return esc(t).replace(/\n/g, "<br>");
  return DOMPurify.sanitize(marked.parse(t, { breaks: true }));
}
function enhance(el) {
  el.querySelectorAll("pre").forEach(pre => {
    if (pre.parentElement.classList.contains("codebox")) return;
    const code = pre.querySelector("code"); if (!code) return;
    const lang = (code.className.match(/language-(\w+)/) || [, "code"])[1];
    if (window.hljs) { try { hljs.highlightElement(code); } catch (e) {} }
    const box = document.createElement("div"); box.className = "codebox";
    box.innerHTML = `<div class="codehead"><span>${esc(lang)}</span><button>${svg(IC.copy, 14)} Copy</button></div>`;
    pre.replaceWith(box); box.appendChild(pre);
    box.querySelector("button").onclick = e => { navigator.clipboard.writeText(code.innerText); e.currentTarget.innerHTML = svg(IC.check, 14) + " Copied"; setTimeout(() => e.currentTarget.innerHTML = svg(IC.copy, 14) + " Copy", 1500); };
  });
}
const clean = t => t.replace(/<think>[\s\S]*?(<\/think>|$)/g, "").replace(/^\s+/, "");

/* ---------- render ---------- */
function renderList() {
  const l = $("#list"); l.innerHTML = S.chats.length ? '<div class="lbl">Chats</div>' : "";
  S.chats.forEach(c => {
    const d = document.createElement("div"); d.className = "row chat" + (c.id === S.cur ? " active" : "");
    d.innerHTML = `<span>${esc(c.title)}</span><button class="del" title="Delete">${svg(IC.trash, 16)}</button>`;
    d.onclick = () => { if (S.busy) return; S.cur = c.id; renderAll(); closeMobile(); };
    d.querySelector(".del").onclick = e => { e.stopPropagation(); if (S.busy) return; S.chats = S.chats.filter(x => x.id !== c.id); if (S.cur === c.id) S.cur = null; save(); renderAll(); };
    l.appendChild(d);
  });
}
function msgEl(m, streaming) {
  const d = document.createElement("div"); d.className = "msg " + m.role;
  if (m.role === "user") { d.innerHTML = `<div class="bub">${esc(m.content)}</div>`; return d; }
  d.innerHTML = `<div><div class="body${streaming ? " typing" : ""}">${md(m.content || "")}</div></div>`;
  enhance(d);
  if (!streaming && m.content) {
    const a = document.createElement("div"); a.className = "acts";
    a.innerHTML = `<button title="Copy" data-a="c">${svg(IC.copy, 17)}</button><button title="Listen" data-a="s">${svg(IC.speak, 17)}</button><button title="Regenerate" data-a="r">${svg(IC.redo, 17)}</button>`;
    a.onclick = e => { const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.a === "c") { navigator.clipboard.writeText(m.content); b.innerHTML = svg(IC.check, 17); setTimeout(() => b.innerHTML = svg(IC.copy, 17), 1500); }
      if (b.dataset.a === "s") { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(m.content.replace(/[#*`_>]/g, ""))); }
      if (b.dataset.a === "r") regenerate(); };
    d.firstChild.appendChild(a);
  }
  return d;
}
function renderAll() {
  renderList(); renderPills();
  const w = $("#wrap"); w.innerHTML = "";
  const c = curChat();
  if (!c || !c.messages.length) {
    w.innerHTML = `<div class="hero"><h1>How can I help you today?</h1><div class="sugs">${SUGS.map(s => `<button class="sug">${esc(s)}</button>`).join("")}</div></div>`;
    w.querySelectorAll(".sug").forEach(b => b.onclick = () => { $("#input").value = b.textContent; send(); });
  } else c.messages.forEach(m => w.appendChild(msgEl(m)));
  scrollDown();
}
const scrollDown = () => { const s = $("#scroll"); s.scrollTop = s.scrollHeight; };
function renderPills() {
  const p = $("#pills"); p.innerHTML = "";
  const add = (label, fn) => { const d = document.createElement("div"); d.className = "pill"; d.innerHTML = `<span>${esc(label)}</span><button>${svg(IC.x, 12)}</button>`; d.querySelector("button").onclick = fn; p.appendChild(d); };
  if (S.mode === "coder") add("Coder", () => { S.mode = "chat"; renderPills(); });
  if (S.mode === "tools") add(TOOLS[S.tool], () => { S.mode = "chat"; S.tool = null; renderPills(); });
  if (S.search) add("Search", () => { S.search = false; renderPills(); });
  if (S.attach) add(S.attach.name, () => { S.attach = null; renderPills(); paintSend(); });
  p.style.display = p.children.length ? "flex" : "none";
}

/* ---------- models ---------- */
async function loadModels() {
  try {
    const j = await (await fetch("/api/models")).json();
    S.models = j.models || [];
    if (!S.models.some(m => m.id === S.model)) S.model = j.default || (S.models[0] && S.models[0].id);
  } catch (e) { S.models = []; }
  paintModels();
}
function paintModels() {
  $("#modelName").textContent = modelName(S.model);
  const pop = $("#modelPop"); pop.innerHTML = '<div class="grp">Model</div>';
  S.models.forEach(m => {
    const b = document.createElement("button"); b.className = "row";
    b.innerHTML = `<span>${esc(m.name)}</span><span class="chk">${m.id === S.model ? svg(IC.check, 18) : ""}</span>`;
    b.onclick = () => { pickModel(m.id); closePops(); }; pop.appendChild(b);
  });
  const g = $("#mgrid"); g.innerHTML = ""; $("#mcount").textContent = `Models (${S.models.length} available)`;
  S.models.forEach(m => {
    const b = document.createElement("button"); b.className = "mcard" + (m.id === S.model ? " sel" : "");
    b.innerHTML = `<div style="flex:1"><div>${esc(m.name)}</div></div>${m.id === S.model ? svg(IC.check, 18) : ""}`;
    b.onclick = () => pickModel(m.id); g.appendChild(b);
  });
}
function pickModel(id) { S.model = id; store("sx_model", id); paintModels(); }

/* ---------- popovers ---------- */
function closePops() { document.querySelectorAll(".pop").forEach(p => p.classList.remove("show")); }
function showPop(pop, anchor, up) {
  const wasOpen = pop.classList.contains("show"); closePops(); if (wasOpen) return;
  pop.classList.add("show");
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pw - 8)) + "px";
  pop.style.top = (up ? Math.max(8, r.top - ph - 8) : r.bottom + 6) + "px";
}
document.addEventListener("click", e => { if (!e.target.closest(".pop") && !e.target.closest("#modelBtn") && !e.target.closest("#plusBtn")) closePops(); });
$("#modelBtn").onclick = e => showPop($("#modelPop"), e.currentTarget, false);
$("#plusBtn").onclick = e => {
  const pop = $("#plusPop"); pop.innerHTML = "";
  const item = (icon, label, fn, toggle) => { const b = document.createElement("button"); b.className = "row";
    b.innerHTML = svg(icon, 18) + `<span>${label}</span>` + (toggle !== undefined ? `<span class="tg ${toggle ? "on" : ""}"></span>` : "");
    b.onclick = () => { fn(); closePops(); }; pop.appendChild(b); };
  item(IC.clip, "Attach file", () => $("#file").click());
  item(IC.globe, "Web search", () => { S.search = !S.search; renderPills(); }, S.search);
  item(IC.code, "Coder mode", () => { S.mode = S.mode === "coder" ? "chat" : "coder"; S.tool = null; renderPills(); }, S.mode === "coder");
  pop.insertAdjacentHTML("beforeend", '<div class="sep"></div><div class="grp">Tools</div>');
  Object.entries(TOOLS).forEach(([k, v]) => item(IC.tool, v, () => { S.mode = "tools"; S.tool = k; renderPills(); $("#input").focus(); }));
  showPop(pop, e.currentTarget, true);
};

/* ---------- send / stream ---------- */
function setBusy(b) { S.busy = b; paintSend(); }
async function send() {
  if (S.busy) { S.abort && S.abort.abort(); return; }
  let text = $("#input").value.trim();
  if (!text && !S.attach) return;
  if (S.attach) { text = (text || "Please read this file.") + `\n\n[Attached file: ${S.attach.name}]\n\`\`\`\n${S.attach.text}\n\`\`\``; S.attach = null; }
  $("#input").value = ""; autosize();
  let c = curChat();
  if (!c) { c = { id: uid(), title: text.slice(0, 38), messages: [] }; S.chats.unshift(c); S.cur = c.id; }
  c.messages.push({ role: "user", content: text });
  await generate(c);
}
async function regenerate() {
  const c = curChat(); if (!c || S.busy) return;
  while (c.messages.length && c.messages[c.messages.length - 1].role === "assistant") c.messages.pop();
  if (c.messages.length) await generate(c);
}
async function generate(c) {
  renderAll();
  const am = { role: "assistant", content: "" }; c.messages.push(am);
  const el = msgEl(am, true); $("#wrap").appendChild(el); scrollDown();
  const bodyEl = el.querySelector(".body");
  setBusy(true); S.abort = new AbortController();
  let raf = null;
  const paint = () => { raf = null; bodyEl.innerHTML = md(clean(am.content)); enhance(bodyEl); scrollDown(); };
  try {
    const r = await fetch("/api/chat", { method: "POST", signal: S.abort.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: S.model, mode: S.mode, tool: S.tool, search: S.search, temperature: S.temp, messages: c.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content })) }) });
    if (!r.ok) { let m = "Something went wrong. Please try again."; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const ln of lines) {
        const l = ln.trim(); if (!l.startsWith("data:")) continue;
        const d = l.slice(5).trim(); if (d === "[DONE]") continue;
        try { const t = JSON.parse(d).choices?.[0]?.delta?.content; if (t) { am.content += t; if (!raf) raf = requestAnimationFrame(paint); } } catch (e) {}
      }
    }
  } catch (e) {
    if (e.name === "AbortError") { if (!clean(am.content)) am.content = "_Stopped._"; }
    else am.content = clean(am.content) + (am.content ? "\n\n" : "") + "⚠️ " + e.message;
  }
  if (raf) cancelAnimationFrame(raf);
  am.content = clean(am.content) || "_No response. Try another model._";
  setBusy(false); S.abort = null; save(); renderAll();
}

/* ---------- wiring ---------- */
function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; paintSend(); }
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); send(); } });
$("#send").onclick = send;
$("#newChat").onclick = () => { if (S.busy) return; S.cur = null; renderAll(); closeMobile(); $("#input").focus(); };
const closeMobile = () => $("#side").classList.remove("open");
$("#openSide").onclick = () => { const s = $("#side"); if (innerWidth <= 800) s.classList.toggle("open"); else s.classList.toggle("hide"); };
$("#closeSide").onclick = () => { const s = $("#side"); if (innerWidth <= 800) s.classList.remove("open"); else s.classList.add("hide"); };
$("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
function setTheme(t) { document.documentElement.dataset.theme = t; store("sx_theme", t); $("#themeSel").value = t; paintTheme(); }
$("#file").onchange = async e => { const f = e.target.files[0]; if (!f) return; S.attach = { name: f.name, text: (await f.text()).slice(0, 30000) }; e.target.value = ""; renderPills(); paintSend(); };

/* settings */
$("#openSet").onclick = () => { $("#temp").value = S.temp; $("#langSel").value = S.lang; $("#themeSel").value = document.documentElement.dataset.theme; $("#dlg").showModal(); closeMobile(); };
$("#closeSet").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });
$("#themeSel").onchange = e => setTheme(e.target.value);
$("#temp").oninput = e => { S.temp = Number(e.target.value); store("sx_temp", S.temp); };
$("#langSel").onchange = e => { S.lang = e.target.value; store("sx_lang", S.lang); };
$("#clearAll").onclick = () => { if (confirm("Delete all chats?")) { S.chats = []; S.cur = null; save(); renderAll(); $("#dlg").close(); } };

/* voice */
let rec = null;
$("#micBtn").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert("Voice input is not supported in this browser. Please use Chrome.");
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = S.lang; rec.interimResults = true; $("#micBtn").style.color = "#d93b3b";
  rec.onresult = e => { $("#input").value = Array.from(e.results).map(r => r[0].transcript).join(" "); autosize(); };
  const end = () => { rec = null; $("#micBtn").style.color = ""; };
  rec.onend = end; rec.onerror = end; rec.start();
};

/* init */
document.documentElement.dataset.theme = store("sx_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
paintIcons(); renderAll(); loadModels();
</script>
</body>
